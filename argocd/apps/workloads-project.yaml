# Guard rails for the service Applications generated by services.yaml: they may only deploy
# from this config repo, only into staging/prod on this cluster. Platform apps stay on `default`.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    # Created before the ApplicationSet (wave 0) that references it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Service workloads (api, inventory) in staging and prod
  sourceRepos:
    - https://github.com/VirenSawant07/gitops-delivery-config.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: staging
    - server: https://kubernetes.default.svc
      namespace: prod
  # Cluster-scoped kinds are denied unless listed. CreateNamespace=true creates the Namespace,
  # so allow exactly these two Namespaces and nothing else cluster-wide.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: staging
    - group: ""
      kind: Namespace
      name: prod
