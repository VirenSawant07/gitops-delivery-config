# App-of-apps entry point: the only manifest applied by hand (by bootstrap/setup.sh).
# Everything under argocd/apps/ is then created and kept in sync by ArgoCD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VirenSawant07/gitops-delivery-config.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
