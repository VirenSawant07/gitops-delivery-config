{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- if or .Values.networkPolicy.allowFrom .Values.serviceMonitor.enabled }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- if .Values.serviceMonitor.enabled }}
        # Prometheus scrapes /metrics from the monitoring namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        {{- end }}
      ports:
        - port: http
  {{- else }}
  # No allowed peers: an empty `from:` would mean "allow everyone", so deny all ingress instead.
  ingress: []
  {{- end }}
{{- end }}
