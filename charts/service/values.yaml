# Defaults for every service. Per-service, per-environment overrides live in apps/<env>/<service>.yaml.
# The Helm release name becomes the service name (e.g. release "api" -> Deployment/Service "api").

image:
  repository: ""   # required, e.g. ghcr.io/virensawant07/gitops-api
  tag: ""          # required: git SHA, never "latest"
  pullPolicy: IfNotPresent

replicas: 2
containerPort: 8000

# Extra environment variables. APP_VERSION is always set to image.tag.
env: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

pdb:
  minAvailable: 1

# Spread replicas across nodes so one node failure doesn't take every copy down.
# ScheduleAnyway = a preference, not a rule: on a 2-worker Kind cluster a drain can still reschedule.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

serviceMonitor:
  enabled: true     # needs the Prometheus Operator CRDs (installed by platform/monitoring)
  interval: 15s

networkPolicy:
  enabled: false
  # Names (release names) of the services allowed to call this one
  allowFrom: []
