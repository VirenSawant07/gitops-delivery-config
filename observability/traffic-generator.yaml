# Synthetic traffic: a tiny client that calls /products about twice a second in each
# environment, so dashboards and error-rate alerts reflect real requests on a laptop cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: staging
  labels:
    app.kubernetes.io/name: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "while true; do wget -q -O /dev/null -T 2 http://api/products; sleep 0.5; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
