# Grafana loads every ConfigMap labelled grafana_dashboard="1" (dashboards as code).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-delivery-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gitops-delivery.json: |
    {
      "uid": "gitops-delivery",
      "title": "GitOps Delivery Platform",
      "tags": [
        "gitops"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source"
          },
          {
            "name": "namespace",
            "type": "custom",
            "label": "Environment",
            "query": "staging,prod",
            "current": {
              "text": "staging",
              "value": "staging"
            },
            "options": [
              {
                "text": "staging",
                "value": "staging",
                "selected": true
              },
              {
                "text": "prod",
                "value": "prod",
                "selected": false
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"$namespace\", path!~\"/healthz|/readyz|/metrics\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"$namespace\", path!~\"/healthz|/readyz|/metrics\", status=~\"5..\"}[1m])) / sum by (service) (rate(http_requests_total{namespace=\"$namespace\", path!~\"/healthz|/readyz|/metrics\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", path!~\"/healthz|/readyz|/metrics\"}[2m])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Traffic by running version",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (service, version) (rate(http_requests_total{namespace=\"$namespace\", path!~\"/healthz|/readyz|/metrics\"}[1m]))",
              "legendFormat": "{{service}} {{version}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU used / limit",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container=\"app\"}[2m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", container=\"app\", resource=\"cpu\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory used / limit",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container=\"app\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", container=\"app\", resource=\"memory\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container restarts (15m)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[15m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
